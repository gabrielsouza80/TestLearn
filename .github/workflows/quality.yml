name: Quality
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      retention_base_sha:
        description: Exact first-parent SHA of the selected commit for append-only comparison
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-release.mjs
      - run: node scripts/check-retained-assets.mjs
      - run: node --test scripts/check-release.test.mjs scripts/check-retained-assets.test.mjs scripts/check-live-asset-retention.test.mjs scripts/check-retained-append-only.test.mjs scripts/check-advanced-isolation.test.mjs scripts/check-vercel-build.test.mjs
      - run: node scripts/check-retained-append-only.mjs
      - run: node scripts/check-live-asset-retention.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
