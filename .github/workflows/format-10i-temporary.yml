name: Format 10I Candidate (temporary)
on:
  push:
    branches: [fix/10i-retained-static-assets]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/release/phase10i-retained-assets.md scripts/check-live-asset-retention.mjs scripts/check-live-asset-retention.test.mjs scripts/check-retained-append-only.mjs scripts/check-retained-assets.test.mjs
      - name: Emit formatted files for read-only review
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const paths = ["docs/release/phase10i-retained-assets.md","scripts/check-live-asset-retention.mjs","scripts/check-live-asset-retention.test.mjs","scripts/check-retained-append-only.mjs","scripts/check-retained-assets.test.mjs"]; for (const path of paths) console.log("FMT10I_JSON " + JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));'
